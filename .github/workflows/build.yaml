name: OS build

'on':
  workflow_dispatch:
    inputs:
      boards:
        description: '要构建的设备列表 (逗号分隔，默认 panther-x2)'
        required: true
        type: string
        default: 'panther-x2'
      version_suffix:
        description: '版本后缀 (留空为正式版如 18.4，输入 dev 则生成开发版)'
        required: false
        type: string
        default: ""
      create_draft_release:
        description: '编译完成后是否自动生成 Draft Release'
        required: true
        type: boolean
        default: true

jobs:
  # 阶段 1：解析配置并构建/更新 builder 容器
  prepare:
    name: Prepare & Builder Image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      version_full: ${{ steps.parse.outputs.version_full }}
      builder_image: ghcr.io/${{ github.repository_owner }}/haos-builder@${{ steps.build_builder.outputs.digest }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Parse configuration
        id: parse
        run: |
          . "${GITHUB_WORKSPACE}/buildroot-external/meta"
          suffix="${{ inputs.version_suffix }}"
          if [ -n "${suffix}" ]; then
            version_full="${VERSION_MAJOR}.${VERSION_MINOR}.${suffix}"
          else
            version_full="${VERSION_MAJOR}.${VERSION_MINOR}"
          fi
          echo "version_full=${version_full}" >> $GITHUB_OUTPUT

          raw_boards="${{ inputs.boards }}"
          json_array=$(echo "${raw_boards}" | tr ',' '\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' | jq -R . | jq -s -c .)
          echo "matrix=${json_array}" >> $GITHUB_OUTPUT
          echo "Target boards: ${json_array}, Version: ${version_full}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Builder Image
        uses: docker/build-push-action@v6
        id: build_builder
        with:
          context: .
          file: Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/haos-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

  # 阶段 2：针对每个设备并行/独立编译
  build:
    name: Build (${{ matrix.board }})
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/cache/cc /mnt/output
          sudo ln -sf /mnt/output "${GITHUB_WORKSPACE}/output"
          sudo chown -R "$(id -u):$(id -g)" /mnt/cache /mnt/output

      - name: Setup RAUC keys
        env:
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}
        run: |
          if [ -n "${RAUC_CERTIFICATE}" ] && [ -n "${RAUC_PRIVATE_KEY}" ]; then
            echo "${RAUC_CERTIFICATE}" > cert.pem
            echo "${RAUC_PRIVATE_KEY}" > key.pem
          fi

      - name: Apply version suffix
        if: ${{ inputs.version_suffix != '' }}
        run: |
          sed -i -E "s/(^VERSION_SUFFIX=\").*(\"$)/\1${{ inputs.version_suffix }}\2/" buildroot-external/meta

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/cache/cc
          key: haos-cc-${{ matrix.board }}-${{ github.run_id }}
          restore-keys: |
            haos-cc-${{ matrix.board }}-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build HAOS image
        run: |
          board="${{ matrix.board }}"
          defconfig="${board//-/_}_defconfig"
          echo "Building ${board} with ${defconfig} using ${{ needs.prepare.outputs.builder_image }}..."

          docker run --rm --privileged \
            -e BUILDER_UID="$(id -u)" \
            -e BUILDER_GID="$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/build" \
            -v "/mnt/cache:/cache" \
            -v "/mnt/output:/build/output" \
            ${{ needs.prepare.outputs.builder_image }} \
            bash -c "make ${defconfig} && make"

      - name: Prune old ccache
        run: |
          echo "Cache size before pruning: $(du -sh /mnt/cache/cc)"
          find /mnt/cache/cc -mindepth 1 -type f -not -anewer output/Makefile -delete || true
          echo "Cache size after pruning: $(du -sh /mnt/cache/cc)"

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /mnt/cache/cc
          key: haos-cc-${{ matrix.board }}-${{ github.run_id }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haos_${{ matrix.board }}-${{ needs.prepare.outputs.version_full }}
          path: |
            output/images/haos_${{ matrix.board }}-*

  # 阶段 3：汇总全部设备产物生成 Draft Release
  release:
    name: Create Draft Release
    needs: [prepare, build]
    if: ${{ inputs.create_draft_release }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'haos_*'
          path: release-assets
          merge-multiple: true

      - name: Compute Checksums
        working-directory: release-assets
        run: |
          sha256sum haos_* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish or Update Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version_full }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, uploading new assets..."
            gh release upload "${TAG}" --clobber release-assets/*
          else
            echo "Creating draft release ${TAG}..."
            cat <<'NOTES' > /tmp/release_notes.md
          ### Home Assistant OS (Draft Release)

          #### 固件校验和 (SHA-256)
          ```
          NOTES
            cat release-assets/SHA256SUMS >> /tmp/release_notes.md
            cat <<'NOTES' >> /tmp/release_notes.md
          ```

          > 该 Release 默认为 Draft 草稿状态，请在核验固件附件无误后手动点击「Publish release」发布转正。
          NOTES

            gh release create "${TAG}" \
              --draft \
              --title "Home Assistant OS ${TAG}" \
              --notes-file /tmp/release_notes.md \
              release-assets/*
          fi
